[pytest]
# 将 pytest 自管的全部临时产物集中到 .pytest_tmp/，根治仓库根目录污染：
#   - addopts --basetemp : tmp_path 产物（pytest-of-<user>/pytest-N）
#   - cache_dir          : .pytest_cache 及其原子建目录时的临时目录 pytest-cache-files-*
# 两处均已被 .gitignore 覆盖，不随 git 提交；CI 与本地行为一致。
addopts = --basetemp=.pytest_tmp
cache_dir = .pytest_tmp/cache
testpaths = tests
