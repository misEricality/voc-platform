# ============================================================
# 主题词表 - 游戏类（VoC v2 · 三级标签体系）
# ============================================================
# 【操作指引 · 打标系统必读】
#
# 1. 层级定义
#    L1 一级标签  -> topic 字段候选（primary 列表，prompt 全量注入）
#    L2 二级标签  -> sub_topics 字段候选（hierarchy 的键，0~5 个）
#    L3 三级关键词 -> 中性话题锚点词（判别参考 + 未来本地规则匹配词典）
#
# 2. 正交原则（主题轴 × 情感轴 严格独立）
#    标签体系只回答"谈什么"，"好不好"一律由 sentiment / sentiment_score 字段承载。
#    所有 L3 词均为中性锚点词，禁止包含评价倾向词。
#    禁止示例：玩法单一 / 内容太少 / 太难 / 太贵 / 剧情拖沓 / 角色过强 ...
#    正确用法：评论"玩法非常丰富" -> sub_topics=[玩法机制] + sentiment=positive，
#    不得为评价形容词单独造标签。
#
# 3. 归因裁定（解决跨维度交叉，如"画质"设计 vs 表现）
#    同一现象有明确归因时，按归因指向归属：
#      "画面糊、优化太差"      -> 技术与性能·硬件与优化（归因：优化/设备）
#      "画面美、呈现功底好"    -> 叙事与表现·画面视觉（归因：美术/设计）
#      "卡顿，是服务器问题"    -> 技术与性能·联机与网络（归因：网络）
#    无明确归因时，落现象本体维度：画质 -> 画面视觉；卡顿/掉帧 -> 帧数与流畅度。
#
# 4. sub_topics 选择规则
#    主标签 topic = 该评论最核心的讨论对象；
#    sub_topics = 其余显著话题，按讨论篇幅降序，同一二级内合并，最多 5 个。
#
# 5. "服务"消歧
#    "服务"不再作为一级标签：网络服务 -> 联机与网络；客户服务 -> 客服与售后。
#
# 6. 兜底
#    "其他"承接跨维度 / 无法归类话题，保证穷尽性（fallback）。
# ============================================================

primary:
  - 玩法与内容
  - 叙事与表现
  - 操作与交互
  - 技术与性能
  - 商业与发行
  - 社区与生态
  - 其他

fallback: 其他

# ============================================================
# 三级标签体系 hierarchy: <一级> -> <二级> -> [三级中性锚点词]
# ============================================================

hierarchy:
  # ---------------- L1-01 玩法与内容（原"游戏性"拆解） ----------------
  玩法与内容:
    玩法机制:
      - 核心玩法
      - 战斗系统
      - 技能系统
      - 动作系统
      - 游戏系统
      - 机制规则
    平衡性:
      - 数值平衡
      - 职业平衡
      - 角色强度
      - 版本调整
      - 克制关系
    内容量:
      - 流程长度
      - 游戏时长
      - 关卡数量
      - 支线内容
      - 通关后内容
      - 内容规模
    重复可玩性:
      - 多周目
      - 随机要素
      - 刷宝
      - 重玩价值
    关卡与地图:
      - 关卡设计
      - 地图探索
      - 解谜
      - 开放世界
      - 区域布局
    难度设计:
      - 难度曲线
      - 难度选项
      - 挑战性
      - 上手门槛

  # ---------------- L1-02 叙事与表现（原"剧情/画面/音效"重组） ----------------
  叙事与表现:
    剧情叙事:
      - 主线
      - 支线
      - 结局
      - 情节结构
      - 叙事节奏
      - 剧情篇幅
    角色与世界观:
      - 角色塑造
      - 人物刻画
      - 背景设定
      - 题材来源
      - 文化内涵
      - 原创设定
    画面视觉:
      - 画质
      - 美术风格
      - 建模
      - 特效
      - 光影
      - 动画演出
      - 场景设计
    音乐音效:
      - BGM
      - 配乐
      - 音效
      - 主题曲
      - 片尾曲
    本地化与配音:
      - 中文配音
      - 翻译质量
      - 字幕
      - 本地化

  # ---------------- L1-03 操作与交互（原"操作"拓展） ----------------
  操作与交互:
    操作手感:
      - 打击感
      - 按键响应
      - 移动控制
      - 连招流畅度
    操控与兼容:
      - 手柄支持
      - 键鼠
      - 自定义按键
      - 触屏
      - 辅助功能
    界面与引导:
      - UI
      - HUD
      - 菜单
      - 新手引导
      - 地图导航

  # ---------------- L1-04 技术与性能（原"性能"拆分） ----------------
  技术与性能:
    帧数与流畅度:
      - 帧数
      - 掉帧
      - 卡顿
      - 加载时间
    稳定性与缺陷:
      - 闪退
      - 崩溃
      - Bug
      - 存档
    硬件与优化:
      - 配置要求
      - 显卡适配
      - 画质设置
      - 渲染优化
      - DLSS
      - FSR
    联机与网络:
      - 服务器
      - 延迟
      - 丢包
      - 匹配
      - 加速器
    平台功能:
      - 云存档
      - 成就
      - 跨平台
      - 家庭共享

  # ---------------- L1-05 商业与发行（原"价格/客服/服务"重组） ----------------
  商业与发行:
    价格与价值:
      - 定价
      - 折扣
      - 史低
      - 性价比
    付费与内购:
      - DLC
      - 抽卡
      - 战令
      - 季票
    发行与更新:
      - 抢先体验
      - 更新频率
      - 版本
      - 停更
      - 跳票
    客服与售后:
      - 客服响应
      - 退款
      - 封禁申诉
      - 账号

  # ---------------- L1-06 社区与生态（新增） ----------------
  社区与生态:
    多人环境:
      - 外挂
      - 匹配质量
      - 队友
      - 玩家氛围
      - 举报
    社区与UGC:
      - 创意工坊
      - Mod
      - 玩家社区
      - 活动
      - 赛事
    社交功能:
      - 好友
      - 组队
      - 公会
      - 语音

  # ---------------- L1-07 其他（兜底，每层不留空） ----------------
  # L2「整体评价」：容纳"好玩/垃圾/神作"等无具体场景但包含有效观点与态度的评价
  # L3「整体评价」：与 L2 同名（无更细颗粒度，保持层级完整，路径=其他/整体评价/整体评价）
  # L2「整活/梗」：容纳 CS2 等社区"整活/梗"类评论（如"坟头草是绿的也算绿玩吗"），有观点态度但无具体场景
  # L3「整活/梗」：与 L2 同名（路径=其他/整活/梗）
  其他:
    整体评价:
      - 整体评价
    整活/梗:
      - 整活/梗
