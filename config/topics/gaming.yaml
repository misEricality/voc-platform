hierarchy:
  机制与内容:
    核心机制与循环:
    - 战斗系统
    - 动作系统
    - 解谜机制
    - 刷宝机制
    - 生存与建造
    - 资源管理
    - 规则逻辑
    关卡与空间:
    - 关卡布局设计
    - 地图探索机制
    - 开放世界设计
    - 箱庭空间设计
    平衡性与数值:
    - 数值设计
    - 职业·角色平衡
    - 版本强弱分布
    - 机制克制关系
    难度与成长:
    - 难度曲线
    - 难度梯度
    - 挑战性考验
    - 上手门槛
    - 角色养成·技能树
    内容量与生命周期:
    - 流程长度·主线时长
    - 内容体量与规模
    - 终局·通关后内容(Endgame)
    - 多周目与重复可玩性
  操控与交互:
    操作手感与反馈:
    - 打击感与震动反馈
    - 按键输入响应·延迟
    - 角色移动与视角控制
    - 招式·连招衔接
    设备操控适配:
    - 手柄支持与适配
    - 键鼠操控体验
    - 自定义按键映射
    - 无障碍辅助功能
    界面与交互(UI/UX):
    - UI视觉与布局
    - HUD抬头显示
    - 菜单导航与逻辑
    - 新手引导与教程
  视觉与艺术:
    画面品质与技术:
    - 画面分辨率·清晰度
    - 3D模型精细度
    - 粒子与光影特效
    - 渲染品质
    美术与演出:
    - 美术视觉风格
    - 场景构图与美感
    - 动画演出·CG过场
  叙事与世界观:
    剧情与叙事:
    - 主线剧情
    - 支线任务故事
    - 多结局设计
    - 叙事节奏与结构
    - 文案品质
    角色与设定:
    - 角色塑造与性格
    - 世界观·背景设定
    - 文化内涵与隐喻
    本地化:
    - 文本翻译准确性
    - 字幕显示与同步
  声音与音频:
    音乐:
    - 背景音乐(BGM)
    - 原声带(OST)·配乐
    - 主题曲·片尾曲
    音效与配音:
    - 战斗·环境音效
    - 中文配音表现
    - 外语配音表现
  技术与性能:
    帧数与流畅度:
    - 帧率表现(FPS)
    - 帧数波动·掉帧
    - 画面卡顿·顿挫
    - 场景加载速度
    稳定性与缺陷:
    - 程序崩溃·报错
    - 程序闪退
    - 运行Bug·代码漏洞
    - 存档损坏·丢失
    硬件与优化:
    - 硬件配置要求
    - 显卡适配与优化
    - DLSS·FSR超采样
    - 设备发热与功耗
  平台与安全:
    联机与网络:
    - 服务器连通性·状态
    - 网络延迟(Ping)
    - 丢包·网络掉线
    - 匹配机制(网络侧)
    - 加速器依赖度
    平台生态功能:
    - Steam Deck·掌机适配
    - 云存档同步
    - 成就系统
    - 跨平台联机·进度
    环境与安全防护:
    - 外挂与作弊现象
    - 反作弊系统(VAC·EAC)
    - 第三方DRM(Denuvo)
    - 第三方启动器(Launcher)绑定
  社区与社交:
    多人社交环境:
    - 队友行为(坑·挂机·送头)
    - 组队开黑·匹配社交
    - 语音沟通体验
    - 公会·战队系统
    - 社区风气与玩家素质
    UGC与生态:
    - 创意工坊
    - Mod模组生态
    - 社区活动与赛事
  商业与运营:
    定价与性价比:
    - 售价策略
    - 折扣促销力度
    - 历史最低价
    - 性价比与心理预期
    商业模式与氪金:
    - DLC·付费扩展包
    - 抽卡·开箱概率
    - 战令·通行证设计
    - 微交易·内购点
    - 肝度与时间成本
    运营与版本更新:
    - 内容更新频率
    - 抢先体验(EA)完成度
    - 暗改·机制变更
    - 停更与维护态度
    - 客服响应与退款服务
  综合与元表达:
    整体印象:
    - 综合推荐度
    - 总体体验评价
    社区梗与反讽:
    - 评测区排版·字符画
    - 网络梗与段子
    - 反讽·阴阳怪气表达
