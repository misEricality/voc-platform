# 自动化采集监控目标清单
#
# 用途：P6 自动化流水线每日增量采集的目标驱动列表。
# 由 scripts/ops/daily_incremental_collect.py 加载，
# 对每个 enabled=true 的目标调用 run_pipeline（带 posted_after 滑窗）。
#
# 行为约定：
# - enabled=false：跳过该目标（无需删除配置，便于临时停采）
# - count：单次采集上限（None = 由采集器自动模式，按时间窗耗尽）
# - language：仅 Steam 生效；Bilibili 由采集器内部决定
# - 新增目标只需在本文件追加，无需改 Python/workflow
#
# 最后更新：2026-08-23（4 款 Steam 网游数据归档 + 显式排除）

version: 1

# B 站不在本计划范围（详见 docs/architecture/BILIBILI_COLLECTION.md：
# B 站为「发布满 7 天后的稳态快照」，采 1 次即代表该视频口碑，无需每日采集）。
# 如未来需要 B 站每日趋势，单独评估后再加。

# === 显式排除（2026-08-23 生效）===
# 这 4 款 Steam 网游的历史数据已归档到 data/archive/online_games_2026-08-23.db，
# 从主 DB data/voc.db 移除。日常采集不再覆盖这 4 款。
# 理由：
#   - 网游评论多为「匹配 / 外挂 / 平衡」类短期反馈，对 P9 阶段 2 L3.5 微话题下钻价值低
#   - 单机游戏反馈更聚焦内容质量，与「用户在吵什么」的核心问题更匹配
# - 若未来想看网游口碑对比，从归档 DB 单独查询即可
# - 若想恢复采集，从归档 DB 导入 + 重新加入下方 targets 即可
excluded_targets:
  - target_id: steam:578080
    name: "PUBG: BATTLEGROUNDS"     # 名字含半角冒号必须加引号，否则 YAML 解析失败
    reason: 已归档到 online_games_2026-08-23.db（PUBG 2571 条 / 2026-07-31~08-16）
    archived_db: data/archive/online_games_2026-08-23.db
  - target_id: steam:1172470
    name: Apex Legends
    reason: 已归档到 online_games_2026-08-23.db（Apex 1452 条 / 2026-07-31~08-16）
