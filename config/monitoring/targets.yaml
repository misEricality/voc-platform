  - target_id: steam:570
    name: Dota 2
    reason: 已归档到 online_games_2026-08-23.db（Dota 433 条 / 2026-07-31~08-16）
    archived_db: data/archive/online_games_2026-08-23.db
  - target_id: steam:730
