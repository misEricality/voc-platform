name: Daily VoC Collection

on:
  schedule:
    # 每天 UTC 17:00（北京时间次日凌晨 1:00）运行
    # —— 选 17:00 UTC 而非 0:00 UTC：GH Actions schedule 历史上最多延迟 ~8h，
    # 0:00 UTC + 延迟 = 北京下午 4 点才跑完，太晚；17:00 UTC 即便延迟 8h 也只到次日上午 9 点 BJT。
    # 详见 docs/architecture/AUTOMATION_PIPELINE.md §8.5 + AGENTS.md 2026-08-27
    - cron: '0 17 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  # ---- 回归测试 ----
  # 装 requirements-core.txt（不含 torch/transformers/sentence-transformers）→ 跑 pytest。
  # test 与 collect 并列：任一失败 workflow 标红但不互相阻塞；push 时也能早期发现回归。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装核心依赖
        run: |
          pip install -r requirements-core.txt

      - name: 跑 pytest
        run: |
          python -m pytest tests/ -v

  # ---- 每日采集 ----
  # ⚠️ 2026-09-02 停用：数据链路切换为「本地直采」（Task Scheduler VOC-Local-Daily-Collect，
  #    北京 02:00，见 scripts/ops/register_local_collect_task.ps1）——本地 voc.db 即单一权威源，
  #    消除 GH Actions schedule 8h 抖动与 sync 延迟。恢复云端采集：删除下面的 if: false 即可。
  collect:
    if: false
    runs-on: ubuntu-latest
    # 60 分钟兜底：6 款 Steam × auto 模式翻页 + LLM 标注 GLM-5.3-Flash，正常 < 20 分钟；
    # count=null（auto）后单 target 极端情况可达 ~30 分钟（参见 AGENTS.md 2026-08-25）；
    # 60 分钟上限给连败补救留 2x 安全冗余。30 分钟曾在 2026-09-01 实际超时。
    timeout-minutes: 60

    # 需要 contents: write 以创建/上传 GH Release asset
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 每日增量采集 + 上传 GH Release
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          # 主标注器：智谱 BigModel GLM-5.3-Flash（2026-08-31 切换）
          # 与 DEEPSEEK 共用 prompt 集合，analyzer_version 格式：llm:glm-5.3-flash@{prompt_hash8}
          # 凭据名统一 XXX_API_KEY 格式（与 DEEPSEEK_API_KEY/QWEN_API_KEY/STEAM_API_KEY 一致）
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          # DEEPSEEK_API_KEY 暂留（保留环境变量以备回退），实际标注改用 GLM-5.3-Flash
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYZER_PROVIDER: glm-5.3-flash
          # 默认 GITHUB_TOKEN 即可；gh CLI 自动使用 Actions token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 抑制向量化（CI 无 ML 环境；embedder 自动降级跳过）
          VOC_SKIP_EMBEDDING: "1"
        run: |
          python scripts/ops/daily_incremental_collect.py

      - name: 上传 DB 为 workflow artifact（30 天窗口，作为 release 失败时的 fallback）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voc-db-${{ github.run_number }}
          path: data/voc.db
          retention-days: 30

      - name: 校验今日 Release asset（silent 失败防御；AGENTS.md 2026-08-27 + 2026-09-01 上线）
        # 详见 scripts/ops/verify_release_upload.py + docs/architecture/AUTOMATION_PIPELINE.md §8.3
        # 用 if: always() 在 collect 失败时也跑；步骤失败 exit 1 → workflow 标红 → GH 邮件告警
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ops/verify_release_upload.py