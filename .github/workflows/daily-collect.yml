name: Daily VoC Collection

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  # ---- 回归测试 ----
  # 装 requirements-core.txt（不含 torch/transformers/sentence-transformers）→ 跑 pytest。
  # test 与 collect 并列：任一失败 workflow 标红但不互相阻塞；push 时也能早期发现回归。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装核心依赖
        run: |
          pip install -r requirements-core.txt

      - name: 跑 pytest
        run: |
          python -m pytest tests/ -v

  # ---- 每日采集 ----
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 需要 contents: write 以创建/上传 GH Release asset
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 每日增量采集 + 上传 GH Release
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ANALYZER_PROVIDER: qwen
          # 默认 GITHUB_TOKEN 即可；gh CLI 自动使用 Actions token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 抑制向量化（CI 无 ML 环境；embedder 自动降级跳过）
          VOC_SKIP_EMBEDDING: "1"
        run: |
          python scripts/ops/daily_incremental_collect.py

      - name: 上传 DB 为 workflow artifact（30 天窗口，作为 release 失败时的 fallback）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voc-db-${{ github.run_number }}
          path: data/voc.db
          retention-days: 30
