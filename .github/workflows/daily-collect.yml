name: Daily VoC Collection

on:
  schedule:
    # 每天 UTC 17:00（北京时间 凌晨 1:00）。
    # 即使 GH Actions schedule 延迟 8 小时也只在早上 9:00 (北京) 触发，
    # 比 UTC 00:00 配方案「延迟后变下午 4 点」更友好。
    # 历史：2026-08-22 → 8/26 两次 scheduled 跑均延迟 1h+；8/27 直接丢了。
    - cron: '0 17 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  # ---- 回归测试 ----
  # 装 requirements-core.txt（不含 torch/transformers/sentence-transformers）→ 跑 pytest。
  # test 与 collect 并列：任一失败 workflow 标红但不互相阻塞；push 时也能早期发现回归。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装核心依赖
        run: |
          pip install -r requirements-core.txt

      - name: 跑 pytest
        run: |
          python -m pytest tests/ -v

  # ---- 每日采集 ----
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 需要 contents: write 以创建/上传 GH Release asset
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 每日增量采集 + 上传 GH Release
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          # DEEPSEEK_API_KEY：当前 production 标注器（2026-08-25 回退决策）。
          # 8/24-25 跑过 QWEN-flash 但 token-plan 模型名全 404，回 DEEPSEEK。
          # DB 8/27 实测 612 条新标注全部 `llm:deepseek-v4-flash@...`。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYZER_PROVIDER: deepseek
          # 默认 GITHUB_TOKEN 即可；gh CLI 自动使用 Actions token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 抑制向量化（CI 无 ML 环境；embedder 自动降级跳过）
          VOC_SKIP_EMBEDDING: "1"
        run: |
          python scripts/ops/daily_incremental_collect.py

      - name: 上传 DB 为 workflow artifact（30 天窗口，作为 release 失败时的 fallback）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voc-db-${{ github.run_number }}
          path: data/voc.db
          retention-days: 30

      # P6 静默失败防御：daily_incremental_collect.py 的 gh release upload
      # 失败仅记 warning，workflow 仍 success（assets=[] 累积失效）。
      # 本步用 gh release view 检查 voc.db asset 实际状态：
      # - 大小 < min_size（默认 1 KB）或 state != uploaded → exit 1 → 步骤 ❌
      # - GH 邮件告警直接派到工程师邮箱，及时发现 silent 故障。
      # 测试：tests/test_verify_release_upload.py（8 例覆盖 happy + 4 种失败 + gh 缺失）
      - name: 校验今日 Release asset 成功上传（防 P6 静默失败）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ops/verify_release_upload.py
